<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Geo Armstrong / Darkreader404</title>
  <desc id="desc">A neon glass profile interface with code, medical cross, heartbeat, and market candlestick motifs. He/him. Code, care, and market signals.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2b40" stop-opacity=".92"/><stop offset=".5" stop-color="#0e1729" stop-opacity=".88"/><stop offset="1" stop-color="#1b1834" stop-opacity=".92"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2e9ff" stop-opacity=".5"/><stop offset=".45" stop-color="#8396b4" stop-opacity=".1"/><stop offset="1" stop-color="#b08cff" stop-opacity=".4"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7ffe3"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <radialGradient id="cyan"><stop stop-color="#1e7492" stop-opacity=".48"/><stop offset="1" stop-color="#1e7492" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop stop-color="#7849af" stop-opacity=".38"/><stop offset="1" stop-color="#7849af" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#bd426a" stop-opacity=".22"/><stop offset="1" stop-color="#bd426a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a3cbe0" stroke-opacity=".045"/></pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1198" height="468" rx="28"/></clipPath>
    <filter id="glow" x="-50%" y="-70%" width="200%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}
    .beat{stroke-dasharray:800;stroke-dashoffset:0;animation:trace 6s ease-in-out infinite}
    .status{animation:breathe 3s ease-in-out infinite}
    @keyframes trace{0%,18%{stroke-dashoffset:800;opacity:.25}55%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.25}}
    @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.beat,.status{animation:none}}
  </style>
  <rect x="1" y="1" width="1198" height="468" rx="28" fill="#080d18"/>
  <g clip-path="url(#bounds)">
    <ellipse cx="1030" cy="140" rx="340" ry="330" fill="url(#cyan)"/><ellipse cx="690" cy="450" rx="500" ry="290" fill="url(#purple)"/><ellipse cx="60" cy="370" rx="340" ry="250" fill="url(#pink)"/>
    <rect x="18" y="18" width="1164" height="434" rx="22" fill="url(#glass)" stroke="url(#edge)"/><rect x="18" y="18" width="1164" height="434" rx="22" fill="url(#grid)"/>
    <path d="M44 67H1156" stroke="#d4e7ff" stroke-opacity=".1"/>
    <circle cx="48" cy="44" r="4" fill="#ff739b"/><circle cx="64" cy="44" r="4" fill="#b08cff"/><circle cx="80" cy="44" r="4" fill="#a3ffcf"/>
    <text x="104" y="49" class="mono" font-size="12" letter-spacing="2" fill="#9fb4ca">DARKREADER404 / PERSONAL INTERFACE</text>
    <circle cx="1050" cy="44" r="3.5" fill="#a3ffcf" class="status"/><text x="1063" y="48" class="mono" font-size="11" letter-spacing="1.5" fill="#a3ffcf">HELLO, WORLD</text>
    <text x="54" y="112" class="mono" font-size="12" letter-spacing="3" fill="#67e8f9">01 / IDENTITY</text>
    <text x="50" y="187" class="sans" font-size="68" font-weight="700" letter-spacing="-2.7" fill="#edf6ff">Geo Armstrong<tspan fill="#a3ffcf">.</tspan></text>
    <text x="54" y="224" class="mono" font-size="17" fill="#9fb4ca">@Darkreader404 <tspan fill="#526781"> / </tspan> he/him</text>
    <text x="54" y="279" class="sans" font-size="25" fill="#d4dfed">Code. <tspan fill="#ff9fbb">Care.</tspan> <tspan fill="#bca6ff">Market signals.</tspan></text>
    <text x="54" y="309" class="sans" font-size="17" fill="#93a8bf">Curiosity at the intersection of human &amp; machine.</text>
    <g transform="translate(54 350)">
      <rect width="167" height="58" rx="12" fill="#91fce4" fill-opacity=".045" stroke="#a3ffcf" stroke-opacity=".22"/><path d="m18 22-6 7 6 7m14-14 6 7-6 7m-7-18-4 22" fill="none" stroke="#a3ffcf" stroke-width="1.7"/>
      <text x="51" y="25" class="mono" font-size="12" letter-spacing="1.2" fill="#a3ffcf">CYBER</text><text x="51" y="43" class="sans" font-size="12" fill="#93a8bf">Build &amp; explore</text>
    </g>
    <g transform="translate(233 350)">
      <rect width="167" height="58" rx="12" fill="#ff739b" fill-opacity=".045" stroke="#ff739b" stroke-opacity=".22"/><path d="M22 17v24m-12-12h24" stroke="#ff9fbb" stroke-width="2"/>
      <text x="49" y="25" class="mono" font-size="12" letter-spacing="1.2" fill="#ff9fbb">MEDICAL</text><text x="49" y="43" class="sans" font-size="12" fill="#93a8bf">Human-centered</text>
    </g>
    <g transform="translate(412 350)">
      <rect width="176" height="58" rx="12" fill="#b08cff" fill-opacity=".045" stroke="#b08cff" stroke-opacity=".22"/><path d="M15 20v22m9-28v22m9-16v26" stroke="#bca6ff" stroke-width="1.5"/><path d="M15 27v8m9-14v8m9 2v9" stroke="#bca6ff" stroke-width="5"/>
      <text x="49" y="25" class="mono" font-size="12" letter-spacing="1.2" fill="#bca6ff">MARKETS</text><text x="49" y="43" class="sans" font-size="12" fill="#93a8bf">Read the signal</text>
    </g>
    <!-- A glass instrument, combining medical telemetry and market geometry. -->
    <g transform="translate(902 241)">
      <circle r="145" fill="#0b1526" fill-opacity=".55" stroke="#a6d6ee" stroke-opacity=".13"/><circle r="126" fill="none" stroke="#a6d6ee" stroke-opacity=".08" stroke-dasharray="1 9" stroke-width="3"/><circle r="102" fill="none" stroke="#67e8f9" stroke-opacity=".2"/>
      <path d="M-145 0h30M115 0h30M0-145v30M0 115v30" stroke="#67e8f9" stroke-opacity=".45"/>
      <path d="M-87-116A145 145 0 0 1 87-116M-87 116A145 145 0 0 0 87 116" fill="none" stroke="#a3ffcf" stroke-opacity=".6" stroke-width="2"/>
      <text x="0" y="27" class="sans" text-anchor="middle" font-size="112" font-weight="700" letter-spacing="-8" fill="#d9f5ff" fill-opacity=".07">404</text>
      <path d="M-23-81h46v25h25v46H23v25h-46v-25h-25v-46h25z" fill="url(#mint)" fill-opacity=".12" stroke="#a3ffcf" stroke-opacity=".6"/><path d="M-23-81h46v25h25" fill="none" stroke="#d5ffec" stroke-opacity=".8"/>
      <path d="M-171 42h79l17-12 18 27 21-75 24 117 21-57h27l16-16 16 16h108" fill="none" stroke="#67e8f9" stroke-width="8" opacity=".18" filter="url(#glow)"/>
      <path d="M-171 42h79l17-12 18 27 21-75 24 117 21-57h27l16-16 16 16h108" fill="none" stroke="#67e8f9" stroke-width="2" opacity=".3"/>
      <path class="beat" d="M-171 42h79l17-12 18 27 21-75 24 117 21-57h27l16-16 16 16h108" fill="none" stroke="#a3ffcf" stroke-width="2.2" stroke-linecap="round"/>
      <text x="0" y="114" class="mono" text-anchor="middle" font-size="10" letter-spacing="3" fill="#93a8bf">HUMAN × MACHINE</text>
    </g>
    <text x="902" y="421" class="mono" text-anchor="middle" font-size="10" letter-spacing="2" fill="#7b93ad">CODE / CARE / CURIOSITY</text>
  </g>
  <rect x="1" y="1" width="1198" height="468" rx="28" fill="none" stroke="url(#edge)"/>
</svg>
