  <text x="114" y="35" text-anchor="middle" fill="#b08cff" font-family="'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="4">_SIGNAL</text>
  <rect x="177" y="4" width="24" height="12" fill="#080d18"/><text x="189" y="13" text-anchor="middle" fill="#93a8bf" font-family="'Courier New',monospace" font-size="9">r2</text>
