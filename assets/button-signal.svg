<svg xmlns="http://www.w3.org/2000/svg" width="228" height="56" viewBox="0 0 228 56" role="img" aria-labelledby="title">
  <title id="title">Signal navigation</title>
  <!-- Clipped geometry and glitch accents adapted from the supplied radio-button component. -->
  <defs>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#b08cff" stop-opacity=".15"/><stop offset="1" stop-color="#171a30"/></linearGradient>
    <clipPath id="shape"><path d="M28 6H210l12 11-12 27h-18v6H20L6 36V24Z"/></clipPath>
  </defs>
  <style>
