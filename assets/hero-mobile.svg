<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="title desc">
<title id="title">Geo Armstrong / Darkreader404</title><desc id="desc">He/him. Code, care, and market signals in a neon glass profile interface.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2b40" stop-opacity=".92"/><stop offset=".5" stop-color="#0e1729" stop-opacity=".88"/><stop offset="1" stop-color="#1b1834" stop-opacity=".92"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2e9ff" stop-opacity=".5"/><stop offset=".45" stop-color="#8396b4" stop-opacity=".1"/><stop offset="1" stop-color="#b08cff" stop-opacity=".4"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7ffe3"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
    <radialGradient id="cyan"><stop stop-color="#1e7492" stop-opacity=".48"/><stop offset="1" stop-color="#1e7492" stop-opacity="0"/></radialGradient>
    <radialGradient id="purple"><stop stop-color="#7849af" stop-opacity=".38"/><stop offset="1" stop-color="#7849af" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#bd426a" stop-opacity=".22"/><stop offset="1" stop-color="#bd426a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a3cbe0" stroke-opacity=".045"/></pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1198" height="468" rx="28"/></clipPath>
    <filter id="glow" x="-50%" y="-70%" width="200%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:'Courier New',monospace}
    .beat{stroke-dasharray:800;stroke-dashoffset:0;animation:trace 6s ease-in-out infinite}
    .status{animation:breathe 3s ease-in-out infinite}
    @keyframes trace{0%,18%{stroke-dashoffset:800;opacity:.25}55%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.25}}
    @keyframes breathe{0%,100%{opacity:.65}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.beat,.status{animation:none}}
  </style>

  <rect x="1" y="1" width="598" height="538" rx="28" fill="#080d18" stroke="#415367"/>
  <ellipse cx="490" cy="165" rx="200" ry="160" fill="url(#cyan)"/>
  <ellipse cx="120" cy="510" rx="280" ry="160" fill="url(#purple)"/>
  <rect x="12" y="12" width="576" height="516" rx="22" fill="url(#glass)" stroke="url(#edge)"/>
  <rect x="12" y="12" width="576" height="516" rx="22" fill="url(#grid)"/>
  <circle cx="34" cy="37" r="4" fill="#ff739b"/><circle cx="50" cy="37" r="4" fill="#b08cff"/><circle cx="66" cy="37" r="4" fill="#a3ffcf"/>
  <text x="86" y="42" class="mono" font-size="12" letter-spacing="1.6" fill="#9fb4ca">DARKREADER404 / INTERFACE</text>
  <path d="M32 58H568" stroke="#d4e7ff" stroke-opacity=".12"/>
  <g transform="translate(465 162)" fill="none">
    <circle r="88" stroke="#67e8f9" stroke-opacity=".13"/><circle r="71" stroke="#a3ffcf" stroke-opacity=".15" stroke-dasharray="2 9"/>
    <path d="M-12-55h24v15h15v24H12v15h-24v-15h-15v-24h15z" fill="#a3ffcf" fill-opacity=".08" stroke="#a3ffcf" stroke-opacity=".28"/>
    <path class="beat" d="M-82 26h25l9-9 10 18 12-49 14 76 13-36h14l9-9 9 9h49" stroke="#67e8f9" stroke-width="2"/>
  </g>
  <text x="32" y="93" class="mono" font-size="13" letter-spacing="3" fill="#67e8f9">01 / IDENTITY</text>
  <text x="30" y="158" class="sans" font-size="65" font-weight="700" letter-spacing="-2" fill="#edf6ff">Geo</text>
  <text x="30" y="222" class="sans" font-size="62" font-weight="700" letter-spacing="-2.5" fill="#edf6ff">Armstrong<tspan fill="#a3ffcf">.</tspan></text>
  <text x="32" y="258" class="mono" font-size="20" fill="#9fb4ca">@Darkreader404 / he/him</text>
  <text x="32" y="311" class="sans" font-size="28" fill="#d4dfed">Code. <tspan fill="#ff9fbb">Care.</tspan> <tspan fill="#bca6ff">Market signals.</tspan></text>
  <text x="32" y="343" class="sans" font-size="18" fill="#93a8bf">Curiosity at the intersection</text>
  <text x="32" y="369" class="sans" font-size="18" fill="#93a8bf">of human &amp; machine.</text>
  <g transform="translate(32 402)">
    <rect width="168" height="64" rx="12" fill="#a3ffcf" fill-opacity=".04" stroke="#a3ffcf" stroke-opacity=".25"/>
    <text x="16" y="25" class="mono" font-size="15" letter-spacing="1.5" fill="#a3ffcf">&lt;/&gt; CYBER</text><text x="16" y="48" class="sans" font-size="14" fill="#93a8bf">Build &amp; explore</text>
  </g>
  <g transform="translate(216 402)">
    <rect width="168" height="64" rx="12" fill="#ff739b" fill-opacity=".04" stroke="#ff739b" stroke-opacity=".25"/>
    <text x="16" y="25" class="mono" font-size="15" letter-spacing="1.5" fill="#ff9fbb">+ MEDICAL</text><text x="16" y="48" class="sans" font-size="14" fill="#93a8bf">Human-centered</text>
  </g>
  <g transform="translate(400 402)">
    <rect width="168" height="64" rx="12" fill="#b08cff" fill-opacity=".04" stroke="#b08cff" stroke-opacity=".25"/>
    <text x="16" y="25" class="mono" font-size="15" letter-spacing="1.5" fill="#bca6ff">↗ MARKETS</text><text x="16" y="48" class="sans" font-size="14" fill="#93a8bf">Read the signal</text>
  </g>
  <text x="300" y="502" text-anchor="middle" class="mono" font-size="12" letter-spacing="2.5" fill="#93a8bf">CODE / CARE / CURIOSITY</text>
</svg>
